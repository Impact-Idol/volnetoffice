worker_processes 4;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  default_type  application/octet-stream;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forward-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  access_log /dev/stdout;
  error_log /dev/stderr;

  # Upstream for the API server
  upstream plane_api {
    server plane-api:8000;
  }

  # Upstream for MinIO storage
  upstream plane_minio {
    server plane-minio:9000;
  }

  # Redirect HTTP to HTTPS
  server {
    listen 3000;
    return 301 https://$host:3443$request_uri;
  }

  # HTTPS server
  server {
    listen 3443 ssl;

    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy API requests to backend (same-origin, no CORS/CSRF issues)
    location /api/ {
      proxy_pass http://plane_api/api/;
      proxy_set_header Host $http_host;  # Include port number
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_cookie_path / /;
    }

    # Proxy auth requests to backend
    location /auth/ {
      proxy_pass http://plane_api/auth/;
      proxy_set_header Host $http_host;  # Include port number
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_cookie_path / /;
    }

    # Proxy file uploads to MinIO (exact match for presigned POST URLs)
    location = /uploads {
      proxy_pass http://plane_minio/uploads;
      # Set Host to match what was signed in presigned URL
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Allow larger file uploads
      client_max_body_size 50M;
      # Disable buffering for large file uploads
      proxy_buffering off;
      proxy_request_buffering off;
    }

    # Proxy file uploads to MinIO (for GET requests with object paths)
    location /uploads/ {
      proxy_pass http://plane_minio/uploads/;
      # Set Host to match what was signed in presigned URL
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Allow larger file uploads
      client_max_body_size 50M;
      # Disable buffering for large file uploads
      proxy_buffering off;
      proxy_request_buffering off;
    }

    # Static frontend files
    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }
  }
}
