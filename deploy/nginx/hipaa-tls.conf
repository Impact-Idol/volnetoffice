# =============================================================================
# HIPAA-Compliant Nginx TLS Configuration
# =============================================================================
# This configuration enforces HIPAA transmission security requirements
# (§164.312(e)(1)) for encryption in transit.
#
# Include this file in your main nginx.conf server block:
#   include /etc/nginx/conf.d/hipaa-tls.conf;
# =============================================================================

# -----------------------------------------------------------------------------
# TLS Protocol Versions
# -----------------------------------------------------------------------------
# Only allow TLS 1.2 and 1.3 - older versions have known vulnerabilities
ssl_protocols TLSv1.2 TLSv1.3;

# -----------------------------------------------------------------------------
# Cipher Suites
# -----------------------------------------------------------------------------
# Modern cipher suites with forward secrecy
# Prioritizes ECDHE key exchange and AESGCM authenticated encryption
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# Let the client choose the cipher (modern clients prefer secure options)
ssl_prefer_server_ciphers off;

# -----------------------------------------------------------------------------
# SSL Session Settings
# -----------------------------------------------------------------------------
# Session cache for TLS session resumption (improves performance)
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;

# Disable session tickets (not all implementations are secure)
ssl_session_tickets off;

# -----------------------------------------------------------------------------
# OCSP Stapling
# -----------------------------------------------------------------------------
# Improves TLS handshake performance and privacy
ssl_stapling on;
ssl_stapling_verify on;

# DNS resolver for OCSP (use your organization's DNS or public resolvers)
resolver 8.8.8.8 8.8.4.4 1.1.1.1 1.0.0.1 valid=300s;
resolver_timeout 5s;

# -----------------------------------------------------------------------------
# Diffie-Hellman Parameters
# -----------------------------------------------------------------------------
# Generate with: openssl dhparam -out /etc/nginx/ssl/dhparam.pem 4096
# ssl_dhparam /etc/nginx/ssl/dhparam.pem;

# -----------------------------------------------------------------------------
# Security Headers
# -----------------------------------------------------------------------------

# HTTP Strict Transport Security (HSTS)
# Forces browsers to only use HTTPS for 1 year
# includeSubDomains ensures all subdomains are also HTTPS
# preload allows submission to browser HSTS preload lists
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# Prevent MIME type sniffing
add_header X-Content-Type-Options "nosniff" always;

# XSS Protection (legacy browsers)
add_header X-XSS-Protection "1; mode=block" always;

# Prevent clickjacking
add_header X-Frame-Options "DENY" always;

# Referrer Policy - limit information sent to other sites
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy - prevent XSS and data injection
# Customize this based on your application's needs
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

# Permissions Policy - restrict browser features
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# -----------------------------------------------------------------------------
# Request Size Limits
# -----------------------------------------------------------------------------
# Limit request body size to prevent DoS
client_max_body_size 10m;

# Buffer settings
client_body_buffer_size 128k;
client_header_buffer_size 1k;
large_client_header_buffers 4 16k;

# -----------------------------------------------------------------------------
# Timeouts
# -----------------------------------------------------------------------------
# Connection timeouts
client_body_timeout 60s;
client_header_timeout 60s;
send_timeout 60s;

# Keepalive settings
keepalive_timeout 65s;
keepalive_requests 100;

# -----------------------------------------------------------------------------
# Logging for Security Events
# -----------------------------------------------------------------------------
# Log format with additional security-relevant fields
log_format hipaa_security '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          '$ssl_protocol $ssl_cipher '
                          '$request_time $upstream_response_time';

# Use this log format in your server block:
# access_log /var/log/nginx/hipaa_access.log hipaa_security;
