version: "3.8"

x-db-env: &db-env
  PGHOST: ${PGHOST:-plane-db}
  PGDATABASE: ${PGDATABASE:-plane}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD}@plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-mq-env: &mq-env
  RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-https://your-domain.com}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://your-domain.com}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL}
  SECRET_KEY: ${SECRET_KEY}
  AMQP_URL: ${AMQP_URL}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
  # SSO Integration (optional - configure if using external SSO)
  # SSO_API_URL: ${SSO_API_URL:-https://your-sso-domain.com/api}
  # SSO_URL: ${SSO_URL:-https://your-sso-domain.com}

services:
  # Custom-built web frontend with UI customizations
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${WEB_URL}/api
        VITE_WEB_BASE_URL: ${WEB_URL}
        VITE_ADMIN_BASE_URL: ${WEB_URL}
        VITE_ADMIN_BASE_PATH: /god-mode
        VITE_SPACE_BASE_URL: ${WEB_URL}
        VITE_SPACE_BASE_PATH: /spaces
        VITE_LIVE_BASE_URL: ${WEB_URL}
        VITE_LIVE_BASE_PATH: /live
    image: volnetoffice-web-custom:latest
    container_name: volnet-web
    restart: unless-stopped
    depends_on:
      - api
      - worker
    networks:
      - volnet-network

  # Custom-built space module
  space:
    build:
      context: .
      dockerfile: apps/space/Dockerfile.space
      args:
        VITE_API_BASE_URL: ${WEB_URL}/api
        VITE_SPACE_BASE_URL: ${WEB_URL}
    image: volnetoffice-space-custom:latest
    container_name: volnet-space
    restart: unless-stopped
    depends_on:
      - api
      - worker
      - web
    networks:
      - volnet-network

  # Custom-built admin interface
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile.admin
      args:
        VITE_API_BASE_URL: ${WEB_URL}/api
    image: volnetoffice-admin-custom:latest
    container_name: volnet-admin
    restart: unless-stopped
    depends_on:
      - api
      - web
    networks:
      - volnet-network

  # Custom-built live collaboration
  live:
    build:
      context: .
      dockerfile: apps/live/Dockerfile.live
      args:
        VITE_API_BASE_URL: ${WEB_URL}/api
    image: volnetoffice-live-custom:latest
    container_name: volnet-live
    restart: unless-stopped
    environment:
      <<: [*live-env, *redis-env]
    depends_on:
      - api
      - web
    networks:
      - volnet-network

  # Custom-built API backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.api
    image: volnetoffice-api-custom:latest
    container_name: volnet-api
    command: ./bin/docker-entrypoint-api.sh
    restart: unless-stopped
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env]
    depends_on:
      - plane-redis
      - plane-mq
    networks:
      - volnet-network

  # Worker for background tasks
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.api
    image: volnetoffice-api-custom:latest
    container_name: volnet-worker
    command: ./bin/docker-entrypoint-worker.sh
    restart: unless-stopped
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env]
    depends_on:
      - api
      - plane-redis
      - plane-mq
    networks:
      - volnet-network

  # Beat worker for scheduled tasks
  beat-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.api
    image: volnetoffice-api-custom:latest
    container_name: volnet-beat-worker
    command: ./bin/docker-entrypoint-beat.sh
    restart: unless-stopped
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env]
    depends_on:
      - api
      - plane-redis
      - plane-mq
    networks:
      - volnet-network

  # Database migrator
  migrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.api
    image: volnetoffice-api-custom:latest
    container_name: volnet-migrator
    command: ./bin/docker-entrypoint-migrator.sh
    restart: on-failure
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [*app-env, *db-env, *redis-env, *minio-env, *aws-s3-env]
    depends_on:
      - plane-redis
    networks:
      - volnet-network

  # Redis cache
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    container_name: volnet-redis
    restart: unless-stopped
    command: valkey-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks:
      - volnet-network

  # RabbitMQ message queue
  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    container_name: volnet-rabbitmq
    restart: unless-stopped
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - volnet-network

  # MinIO object storage
  plane-minio:
    image: minio/minio:latest
    container_name: volnet-minio
    command: server /export --console-address ":9090"
    restart: unless-stopped
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export
    networks:
      - volnet-network

  # Custom-built reverse proxy
  proxy:
    build:
      context: .
      dockerfile: apps/proxy/Dockerfile.ce
    image: volnetoffice-proxy-custom:latest
    container_name: volnet-proxy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-your-domain.com}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-52428800}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    ports:
      - "${LISTEN_HTTP_PORT:-80}:80"
      - "${LISTEN_HTTPS_PORT:-443}:443"
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live
    networks:
      - volnet-network

networks:
  volnet-network:
    driver: bridge

volumes:
  redisdata:
  uploads:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:
  proxy_config:
  proxy_data:
